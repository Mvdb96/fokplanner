<title>Fokplanner</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2b2418;--mut:#7a6e5b;--bd:#e4dac4;--ac:#b5541c;--acx:#fff;--both:#2f7d4f;--rooster:#b5541c;--hen:#7b4fa3;--bad:#c0392b;--org:#d97706;--gry:#6b6253;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1c1812;--card:#272118;--tx:#f1e9d8;--mut:#a89c85;--bd:#3d3425;--ac:#e07a3f;--acx:#1c1812;--both:#5cc088;--rooster:#e07a3f;--hen:#b690e0;--bad:#ef7a6b;--org:#ffa94d;--gry:#b9ad94}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .6em}h2{font-size:1.1rem;margin:1.2em 0 .5em}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.tab,.btn{border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer}
.tab.on,.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.del{color:#c0392b}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin:4px 0 10px}
label{font-size:.85rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bird img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--bd);display:block}
.ph{display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.tag{display:inline-block;padding:2px 9px;margin:2px 3px 2px 0;border-radius:99px;border:1px solid var(--bd);font-size:.82rem}
.tag button{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 0 0 4px}
.sug .tag{cursor:pointer;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sec{border-left:4px solid var(--bd);padding-left:10px;margin:10px 0}
.mut{color:var(--mut);font-size:.9rem}
.dd{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:10px;max-height:240px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.3)}.dd .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;background:var(--card)}.dd .it:hover{background:var(--bd)}.trow{display:flex;align-items:center;gap:10px;margin:6px 0}.trow .tag{margin:0}.trow input{flex:1;padding:0;margin:0;border:0;background:none}.pk{margin-left:14px;border-left:2px solid var(--bd);padding-left:10px}.pn{margin:6px 0}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--tx);font-size:1rem}.chk input{flex:none;width:20px;height:20px;margin:0;padding:0}
.vw{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.grid.smg{grid-template-columns:repeat(3,1fr);gap:8px}.card.sm{padding:6px;cursor:pointer;margin:0}.sm img,.sm .ph{aspect-ratio:1;font-size:2rem}.sm .nm{font-size:.85rem;text-align:center;padding:4px 0;word-break:break-word}.ia{display:flex;gap:6px;flex-wrap:wrap}.li{display:flex;gap:12px;align-items:center}.li .th{width:72px;flex:none}.th img,.th .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;font-size:1.8rem}.sx{display:flex;gap:10px;margin:6px 0 10px}.sx .btn{flex:1;padding:10px;line-height:1.3}.pickrow{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.pick{flex:none;width:92px;text-align:center;border:2px solid var(--bd);border-radius:10px;padding:4px;cursor:pointer;background:var(--card)}.pick.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.pick img,.pick .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;font-size:2rem}.pick span{font-size:.72rem;display:block;word-break:break-word}
.sm img{width:100%;object-fit:cover;border-radius:8px;display:block}.t{border-radius:8px;overflow:hidden;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto}.t img{width:100%;height:100%;object-fit:cover;display:block}.kids{display:flex;flex-wrap:wrap;gap:10px}.kid{width:72px;text-align:center;cursor:pointer}.kid span{display:block;font-size:.72rem;word-break:break-word}.gty{margin-top:6px}
.fit{display:flex;align-items:center;gap:8px;margin:6px 0}.bar{flex:1;height:10px;border-radius:99px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}summary{cursor:pointer;margin:4px 0}details.card summary{font-weight:600}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.top h1{margin:0}.menu{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.2)}.menu .tab{text-align:left;border:0;background:none;padding:12px}.menu .tab.on{background:var(--ac);color:var(--acx)}.hrow{display:flex;align-items:center;justify-content:space-between}.hrow h2{margin:.6em 0}.ics{display:flex;gap:6px}.ic{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 9px;cursor:pointer;display:flex}.ic.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.chip{cursor:pointer;padding:5px 12px}.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.vk{font-weight:700;margin-left:4px}.vk.gy{color:var(--mut)}.vk.gn{color:var(--both)}.gi{border-bottom:1px solid var(--bd)}.gr{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;cursor:pointer;font-size:1.05rem}.gp{background:var(--bg);border-radius:10px;padding:10px;margin:0 0 10px}.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.seg button{flex:1;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.rf{position:relative}.rf img{width:96px;height:96px;object-fit:cover;border-radius:8px;display:block}.rf .btn{position:absolute;top:2px;right:2px;padding:0 7px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50}.ov img{max-width:96%;max-height:96%;border-radius:8px}
.ck{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px}.sx2{width:1em;height:1em;vertical-align:-.12em}.ph{color:var(--mut)}.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px}.cs{flex:0 0 100%;scroll-snap-align:center;position:relative}.cs img{width:100%;max-height:60vh;object-fit:cover;display:block}.cl{position:absolute;left:12px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 12px;font-size:.85rem}.cx{position:absolute;right:10px;top:8px;padding:2px 9px}.fl{cursor:pointer;color:var(--tx);font-size:1rem;text-align:center}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 10px;margin:2px 3px 2px 0;border-radius:14px;border:1px solid var(--bd);font-size:.82rem;line-height:1.35;max-width:100%}
.vk{display:inline-flex;align-items:center;margin-left:2px;font-weight:700}.ck{flex:none}
.pre{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.slot{aspect-ratio:4/3;width:100%;border-radius:10px;overflow:hidden;background:var(--bd);display:flex;align-items:center;justify-content:center}
.slot img.pic{width:100%;height:100%;object-fit:cover;display:block}.slot.dim .sx2{opacity:.35}
.sx2{object-fit:contain}
.ph .sx2,.slot .sx2{width:55%;height:auto;aspect-ratio:1;object-fit:contain;background:none;border-radius:0}
.pick .ph .sx2,.sm .ph .sx2{width:60%}.t .sx2{width:70%;height:70%;object-fit:contain}
.sx .sx2{width:64px;height:64px}h2 .sx2{width:1.5em;height:1.5em}.tag .sx2{width:1.6em;height:1.6em}
.cl .sx2{width:1.6em;height:1.6em;max-height:none;object-fit:contain}
.sum{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.mr{display:flex;gap:12px;align-items:flex-start}
.trow{display:block;margin:10px 0}.trh{display:flex;justify-content:space-between;align-items:center;gap:8px}.trh .tag{margin:0;min-width:0}.trc{display:flex;align-items:center;gap:10px;margin-top:6px}.trc input[type=range]{flex:1;min-width:120px;accent-color:var(--ac);height:28px;margin:0;padding:0;border:0;background:none}
h2.yh{margin:18px 0 6px;font-size:1.25rem;border-bottom:2px solid var(--bd);padding-bottom:2px}
.gone{position:relative;overflow:hidden;border-radius:10px}.gone::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top right,transparent calc(50% - 1.5px),rgba(255,255,255,.7) calc(50% - 1.5px),rgba(255,255,255,.7) calc(50% + 1.5px),transparent calc(50% + 1.5px));filter:drop-shadow(0 0 1px rgba(0,0,0,.35))}
.cr{position:fixed;inset:0;background:#111;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff}
.cr .fr{position:relative;overflow:hidden;background:#000;touch-action:none;border-radius:6px;outline:2px solid #fff}
.cr canvas{display:block}.cr .row{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center}.cr .row.sm .btn{white-space:nowrap;padding:4px 9px;font-size:.85rem;min-height:0}.cr .btn.big{width:min(320px,80vw);padding:14px;font-size:1.1rem}.cr .mut2{font-size:.85rem;color:#bbb;text-align:center}.cr .btn{background:#2a2a2a;color:#fff;border-color:#555}.cr .btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}.cr .btn.on{border-color:#fff}
.cr input[type=range]{width:min(320px,80vw)}
.pedw{overflow-x:auto;padding:6px 2px 12px}
.tt{display:flex;flex-direction:column;align-items:center;position:relative;width:max-content}
.pedw>.tt{margin:0 auto}
.tc{display:flex;margin-top:14px;position:relative}
.tc::before{content:"";position:absolute;top:-14px;left:50%;height:14px;border-left:2px solid var(--mut)}
.tc>.tt{padding:14px 5px 0}
.tc>.tt::before,.tc>.tt::after{content:"";position:absolute;top:0;width:50%;height:14px;border-top:2px solid var(--mut)}
.tc>.tt::before{right:50%;border-right:2px solid var(--mut)}.tc>.tt::after{left:50%}
.tc>.tt:first-child::before,.tc>.tt:only-child::before{border-top:0}.tc>.tt:only-child::before{border-right:0}.tc:has(>.tt:only-child)::before{height:28px}.tc>.tt:last-child::after,.tc>.tt:only-child::after{border:0}
.pn2{display:flex;flex-direction:column;align-items:center;gap:3px;width:72px;box-sizing:border-box;padding:5px 3px;border:2px solid var(--bd);border-top-width:5px;border-radius:10px;background:var(--card);cursor:pointer;text-align:center}
.pn2.haan{border-top-color:var(--rooster)}.pn2.hen{border-top-color:var(--hen)}.pn2.me{box-shadow:0 0 0 2px var(--ac)}.pn2.dup{border-style:dashed;opacity:.65}
.pn2 img,.pn2 .pi{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center}
.pn2 .pi .sx2{width:90%;height:90%}
.sibs{display:flex}.sibs>.sn{position:relative;padding:0 3px 14px}
.sibs>.sn::before,.sibs>.sn::after{content:"";position:absolute;bottom:0;width:50%;height:14px;border-bottom:2px solid var(--mut)}
.sibs>.sn::before{right:50%;border-right:2px solid var(--mut)}.sibs>.sn::after{left:50%}
.sibs>.sn:first-child::before{border-bottom:0}.sibs>.sn:last-child::after{border:0}
.pnm{display:flex;flex-direction:column;min-width:0;max-width:100%;font-size:.75rem;line-height:1.15}.pnm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pnm small{color:var(--mut)}
.cmpw{overflow-x:auto;margin:0 -2px}.cmp{border-collapse:collapse;width:100%;font-size:.85rem}.cmp th,.cmp td{border:1px solid var(--bd);padding:6px 4px;text-align:center;vertical-align:middle;min-width:84px;background:var(--card)}
.cmp .lb{text-align:left;min-width:96px;position:sticky;left:0;font-weight:600;z-index:1}.cmp td.bst{background:rgba(47,158,90,.2)}.cmp .sec{background:var(--bg);text-align:left;font-weight:700;font-size:.8rem;color:var(--mut)}
h3.gh{margin:14px 0 4px;font-size:1rem;color:var(--mut)}
.hide{display:none}
</style>
</head>
<body>
<main>
<header class="top"><button id="mb" class="btn" onclick="toggleMenu()" aria-label="Menu">☰</button><h1>Fokplanner</h1><span class="mut" id="mt">Fokdieren</span></header>
<nav id="mn" class="menu hide"><button class="tab on" id="t-birds" onclick="tab('birds');toggleMenu(false)">Fokdieren</button><button class="tab" id="t-pairs" onclick="tab('pairs');toggleMenu(false)">Combinaties</button><button class="tab" id="t-match" onclick="tab('match');toggleMenu(false)">Beste match</button><button class="tab" id="t-cmp" onclick="tab('cmp');toggleMenu(false)">Vergelijken</button><button class="tab" id="t-goal" onclick="tab('goal');toggleMenu(false)">Fokdoel</button><button class="tab" id="t-data" onclick="tab('data');toggleMenu(false)">Instellingen</button></nav>
<div id="v-birds"></div>
<div id="v-pairs" class="hide"></div>
<div id="v-match" class="hide"></div>
<div id="v-cmp" class="hide"></div>
<div id="v-goal" class="hide"></div>
<div id="v-data" class="hide"></div>

</main>
<script>
const SUG=["Enkelvoudige kam","Rozenkam","Erwtenkam","V-kam","Kuif","Baard en bakkebaard","Gevederde poten","Vijf tenen","Gele poten","Leikleurige poten","Witte oorlel","Rode oorlel","Gebands","Gezoomd","Wit","Zwart","Koekoek","Patrijs","Lakenvelder","Blauwe eieren","Bruine eieren","Witte eieren","Dwergras"];
(()=>{const d=Object.getOwnPropertyDescriptor(Element.prototype,"innerHTML"),set=d.set;Object.defineProperty(Element.prototype,"innerHTML",{get:d.get,configurable:true,set(v){const own=this.classList&&this.classList.contains("pickrow")?[this.scrollLeft]:null,rows=[...this.querySelectorAll(".pickrow")].map(e=>e.scrollLeft);set.call(this,v);if(own)this.scrollLeft=own[0];this.querySelectorAll(".pickrow").forEach((e,i)=>{if(rows[i])e.scrollLeft=rows[i]})}})})();
let db,birds=[],pairs=[],bd=null,pd=null,pq="",goal=[],bad=[],known=[],mf=[],ms="",pv=null,hidden=[],types={},vmode="groot",pvp=null,bk=null,pbk=null,wt={},ref={haan:[],hen:[]},flt={sex:"",traits:[],year:"",pres:""},link={},cats={},ts=75,scope={},bonus={},ncat="type",nbon="",showGone=false,addKind="goal",msex="",cmpIds=[],thm={},sortB="naam",sortP="jaar-nieuw";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const key=t=>t.trim().toLowerCase();
function open(){return new Promise((ok,no)=>{const r=indexedDB.open("kippen",2);r.onupgradeneeded=()=>{["birds","pairs","meta"].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:"id"})})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const all=s=>new Promise(ok=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>ok(q.result)});
const put=(s,o)=>new Promise(ok=>{const t=db.transaction(s,"readwrite");t.objectStore(s).put(o);t.oncomplete=ok});
const rm=(s,id)=>new Promise(ok=>{const t=db.transaction(s,"readwrite");t.objectStore(s).delete(id);t.oncomplete=ok});
async function load(){birds=await all("birds");pairs=await all("pairs");const mt=await all("meta"),g=mt.find(x=>x.id==="goal"),k=mt.find(x=>x.id==="known");goal=g?g.traits:DEF.slice();bad=(g&&g.bad)||[];types=g?(g.types||{...DEFT}):{...DEFT};wt=(g&&g.wt)||{};link=(g&&g.link)||{};cats=(g&&g.cats)||{};ts=(g&&g.ts)||75;scope=(g&&g.scope)||{};bonus=(g&&g.bonus)||{};birds.forEach(b=>b.traits=ordT(b.traits));known=k?k.traits:[];const hd=mt.find(x=>x.id==="hidden");hidden=hd?hd.traits:[];const vw=mt.find(x=>x.id==="view");vmode=vw?vw.v:"groot";sortB=(vw&&vw.sb)||"naam";sortP=(vw&&vw.sp)||"jaar-nieuw";showGone=!!(vw&&vw.sg);msex=(vw&&vw.sx)||"";{const th=mt.find(x=>x.id==="theme");thm=th?{ac:th.ac,bg:th.bg,card:th.card}:{};applyTheme()}const rf=mt.find(x=>x.id==="ref");ref=rf?{haan:rf.haan||[],hen:rf.hen||[]}:{haan:[],hen:[]};birds.sort((a,b)=>a.name.localeCompare(b.name));pairs.sort((a,b)=>b.updated-a.updated)}
function show(v){$("mt").textContent={birds:"Fokdieren",pairs:"Combinaties",match:"Beste match",cmp:"Vergelijken",goal:"Fokdoel",data:"Instellingen"}[v];if(v!=="birds")pv=null;if(v!=="pairs")pvp=null;["birds","pairs","match","cmp","goal","data"].forEach(x=>{$("v-"+x).classList.toggle("hide",x!==v);$("t-"+x).classList.toggle("on",x===v)});({birds:rBirds,pairs:rPairs,match:rMatch,cmp:rCmp,goal:rGoal,data:rData})[v]()}
const bird=id=>birds.find(b=>b.id===id);
/* ---------- Kippen ---------- */
function newBird(){bk=null;bd={id:uid(),name:"",sex:"haan",photo:"",traits:[],notes:"",str:{},pair:""};rBirds()}
function editBird(id){bd=JSON.parse(JSON.stringify(bird(id)));rBirds()}
function rBirdForm(){
  $("v-birds").innerHTML=`<div class="card"><h2 style="margin-top:0">${bird(bd.id)?"Dier bewerken":"Nieuw dier"}</h2>
  <label>Naam of ringnummer</label><input id="bn" value="${esc(bd.name)}">
  <label>Geslacht</label><div class="sx"><button type="button" id="sxh" class="btn" onclick="setSex('haan')"><span style="font-size:2.6rem">${sxi("haan")}</span><br>Haan</button><button type="button" id="sxn" class="btn" onclick="setSex('hen')"><span style="font-size:2.6rem">${sxi("hen")}</span><br>Hen</button></div>
  <label class="chk" style="margin-top:10px"><input type="checkbox" id="bgone" ${bd.gone?"checked":""}>Dit dier is niet meer aanwezig</label>
  <label>Ouders (voor de stamboom, mag leeg)</label><label style="display:block">Haan</label><div id="wpa"></div><input type="hidden" id="bpa"><label style="display:block">Hen</label><div id="wpm"></div><input type="hidden" id="bpm"><div class="mut" style="font-size:.8rem">Kies je beide ouders, dan wordt dit automatisch een combinatie bij Combinaties.</div><label style="display:block;margin-top:10px">Nakomelingen (mag leeg)</label><div class="mut" style="font-size:.8rem">Kies de andere ouder en daarna de nakomelingen. Dit wordt automatisch een combinatie bij Combinaties.</div><label style="display:block">Andere ouder</label><div id="wpk"></div><input type="hidden" id="bpk"><div id="wkd"></div>
  <label>Geboortejaar</label><input type="number" id="bborn" min="1980" max="2100" placeholder="Bijv. 2026" value="${esc(yr(bd))}">
  <label>Foto</label><input type="file" id="bf" accept="image/*"><div id="bp">${photoImg()}</div>

const gtr=()=>{const [k,i]=gedit.split(":");return (k==="goal"?goal:bad)[+i]};
function gEd(k){gedit=gedit===k?"":k;rGoal()}
async function gRename(){
  const old=gtr(),nn=($("gren").value||"").trim();if(!old||!nn||nn===old)return;
  const ko=key(old),kn=key(nn);
  if(kn!==ko&&[...goal,...bad].some(x=>key(x)===kn)){alert("Dit kenmerk bestaat al in je fokdoel.");return}
  const rn=a=>a.map(x=>key(x)===ko?nn:x),mv=o=>{if(o&&ko in o){if(kn!==ko)o[kn]=o[ko];if(kn!==ko)delete o[ko]}};
  goal=rn(goal);bad=rn(bad);known=rn(known);mf=rn(mf);flt.traits=rn(flt.traits);
  [types,wt,link,cats,scope,bonus].forEach(mv);Object.keys(link).forEach(k=>{if(link[k]===ko)link[k]=kn});
  for(const b of birds){let ch=false;if(b.traits.some(x=>key(x)===ko)){b.traits=rn(b.traits);ch=true}["lvl","car","str"].forEach(n=>{if(b[n]&&ko in b[n]){mv(b[n]);ch=true}});if(ch)await put("birds",b)}
  gedit=gedit.split(":")[0]+":"+(gedit.startsWith("goal")?goal:bad).findIndex(x=>key(x)===kn);
  await put("meta",{id:"known",traits:known});await saveGoal()}
function gSetT(v){types[key(gtr())]=v;saveGoal()}
function gSetW(v){const k=key(gtr());if(+v>1)wt[k]=+v;else delete wt[k];saveGoal()}

const plusTag=n=>n>0?` <span title="Pluspunten" style="font-size:.75rem;color:var(--mut)">+${n} ★</span>`:"";
function potency(r,h){if(!goal.length)return{pct:0,present:0};const tot=nbTot(()=>true);let pen=0;bad.forEach(g=>{if(!linked(g))pen+=wgt(g)*Math.max(bval(r,g),bval(h,g))});const{base}=blend(g=>Math.max(val(r,g),val(h,g)));return{plus:Math.round(goal.filter(g=>bonus[key(g)]).reduce((a,g)=>a+wgt(g)*Math.max(val(r,g),val(h,g)),0)*10)/10,pct:Math.round(100*Math.min(1,Math.max(0,base-(tot?pen/tot:0)))),present:goal.filter(g=>gset(r).has(key(g))||gset(h).has(key(g))).length}}

function rOver(q){q=q||pd;

function cropPhoto(file){return new Promise(done=>{
  const isU=typeof file==="string",url=isU?file:URL.createObjectURL(file),im=new Image();
  const rel=()=>{if(!isU)URL.revokeObjectURL(url)};
  im.onerror=()=>{rel();isU?done(null):shrink(file).then(done)};
  im.onload=()=>{
    const iw=im.naturalWidth,ih=im.naturalHeight;
    let mode="1.3333",asp=4/3,zoom=1,cx=iw/2,cy=ih/2;
    const o=document.createElement("div");o.className="cr";
    o.innerHTML=`<div class="mut2">Sleep om te verschuiven, schuif of knijp om te zoomen</div><div class="fr"><canvas></canvas></div><input type="range" min="1" max="4" step="0.01" value="1" aria-label="Inzoomen"><div class="row sm"><button class="btn on" data-a="1.3333">4:3</button><button class="btn" data-a="1">Vierkant</button><button class="btn" data-a="0.75">Staand</button><button class="btn" data-a="full">Hele foto</button></div><button class="btn pri big" id="crok">Klaar</button><button class="btn" id="crno" style="padding:4px 14px">Annuleren</button>`;
    document.body.appendChild(o);
    const fr=o.querySelector(".fr"),cv=o.querySelector("canvas"),ctx=cv.getContext("2d"),zr=o.querySelector("input");
    let fw=0,fh=0,sc=1;
    function layout(){
      asp=mode==="full"?iw/ih:+mode;
      const mw=Math.min(innerWidth-32,460),mh=innerHeight-250;
      fw=Math.min(mw,mh*asp);fh=fw/asp;cv.width=fw;cv.height=fh;fr.style.width=fw+"px";fr.style.height=fh+"px";draw()}
    function clamp(){
      const base=Math.max(fw/iw,fh/ih);sc=base*zoom;
      const hw=fw/2/sc,hh=fh/2/sc;
      cx=Math.min(iw-hw,Math.max(hw,cx));cy=Math.min(ih-hh,Math.max(hh,cy))}
    function draw(){clamp();ctx.clearRect(0,0,fw,fh);ctx.drawImage(im,fw/2-cx*sc,fh/2-cy*sc,iw*sc,ih*sc)}
    const pts=new Map();let pd0=0;
    fr.addEventListener("pointerdown",e=>{fr.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const[a,b]=[...pts.values()];pd0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
    fr.addEventListener("pointermove",e=>{
      if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
      if(pts.size===1){cx-=(e.clientX-p[0])/sc;cy-=(e.clientY-p[1])/sc;pts.set(e.pointerId,[e.clientX,e.clientY]);draw()}
      else{pts.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd0){zoom=Math.min(4,Math.max(1,zoom*d/pd0));zr.value=zoom;draw()}pd0=d}});
    const up=e=>{pts.delete(e.pointerId);pd0=0};fr.addEventListener("pointerup",up);fr.addEventListener("pointercancel",up);
    fr.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.min(4,Math.max(1,zoom*(e.deltaY<0?1.08:1/1.08)));zr.value=zoom;draw()},{passive:false});
    zr.oninput=()=>{zoom=+zr.value;draw()};
    o.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{mode=b.dataset.a;o.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x===b));zoom=1;zr.value=1;cx=iw/2;cy=ih/2;layout()});
    const end=r=>{o.remove();rel();done(r)};
    o.querySelector("#crno").onclick=()=>end(null);
    o.querySelector("#crok").onclick=()=>{
      clamp();const sw=fw/sc,sh=fh/sc,ow=Math.min(900,Math.round(sw)),oh=Math.round(ow/asp),c=document.createElement("canvas");c.width=ow;c.height=oh;
      c.getContext("2d").drawImage(im,cx-sw/2,cy-sh/2,sw,sh,0,0,ow,oh);end(c.toDataURL("image/jpeg",.85))};
    layout()}
  im.src=url})}

  const list=sortBirds(birds.filter(x=>x.sex===sex&&x.id!==bd.id));
  w.innerHTML=`<details class="card" style="margin:0 0 8px;padding:8px"><summary style="display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer">${th(sel,56)}<span style="flex:1;min-width:0">${sel?`<b>${esc(sel.name)}</b>${sel.born?` <span class="mut">· ${esc(yr(sel))}</span>`:""}`:`<span class="mut">Onbekend, tik om te kiezen</span>`}</span><span class="mut">▾</span></summary><div class="pickrow" style="margin-top:8px"><div class="pick${cur?"":" on"}" onclick="setPar('${id}','${sex}','')"><div class="ph" style="display:flex;align-items:center;justify-content:center;font-size:1.6rem">?</div><span>Onbekend</span></div>${list.map(b=>`<div class="pick${cur===b.id?" on":""}" onclick="setPar('${id}','${sex}','${b.id}')">${b.photo?`<img src="${b.photo}" alt="">`:`<div class="ph">${sxi(b.sex)}</div>`}<span>${esc(b.name)}${b.born?" · "+esc(yr(b)):""}</span></div>`).join("")}</div></details>`}
function setPar(id,sex,v){$("b"+id).value=v;parRender(id,sex);if(id==="pk")kidRender()}
/* ---------- Dieren vergelijken ---------- */
function cmpT(id){cmpIds=cmpIds.includes(id)?cmpIds.filter(x=>x!==id):cmpIds.length<4?[...cmpIds,id]:cmpIds;rCmp()}
function cmpGone(v){showGone=v;saveView();rCmp()}
function rCmp(){
  cmpIds=cmpIds.filter(id=>bird(id));
  const sel=cmpIds.map(bird),pool=sortBirds(birds.filter(b=>showGone||!b.gone||cmpIds.includes(b.id)));
  const tile=b=>`<div class="pick${cmpIds.includes(b.id)?" on":""}" onclick="cmpT('${b.id}')">${b.photo?`<img src="${b.photo}" alt="">`:`<div class="ph">${sxi(b.sex)}</div>`}<span>${esc(b.name)}${yr(b)?" · "+esc(yr(b)):""}</span></div>`;
  let h=`<div class="card"><label style="display:block">Kies 2 tot 4 dieren om naast elkaar te zetten</label><label class="chk" style="margin-top:6px"><input type="checkbox" ${showGone?"checked":""} onchange="cmpGone(this.checked)">Toon ook dieren die niet meer aanwezig zijn</label><div class="pickrow" style="margin-top:8px">${pool.map(tile).join("")||'<span class="mut">Nog geen dieren.</span>'}</div>${cmpIds.length?`<div style="margin-top:8px"><button class="btn" onclick="cmpIds=[];rCmp()">Wissen</button></div>`:""}</div>`;
  if(sel.length<2){h+=`<p class="mut">Kies minstens twee dieren om ze te vergelijken.</p>`;$("v-cmp").innerHTML=h;return}
  const cell=(b,g)=>{if(!applies(b,g))return'<span class="mut" style="font-size:.7rem">telt niet</span>';if(!hasT(b,g))return'<span class="mut">–</span>';if(isCar(b,g))return'<span class="mut" style="font-size:.8rem">Drager</span>';return tp(g)==="slider"?mk(sv(b,g)):mk(2)};
  const head=sel.map(b=>`<th onclick="openBird('${b.id}')" style="cursor:pointer">${b.photo?`<img src="${b.photo}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px">`:`<div class="ph" style="width:64px;height:64px;margin:0 auto">${sxi(b.sex)}</div>`}<div><b>${esc(b.name)}</b></div><div class="mut" style="font-size:.75rem;font-weight:400">${b.sex==="haan"?"Haan":"Hen"}${yr(b)?" · "+esc(yr(b)):""}${b.gone?" · niet meer aanwezig":""}</div></th>`).join("");
  const fits=sel.map(fit),mx=Math.max(...fits);
  const rowG=g=>{const v=sel.map(b=>val(b,g)),m=Math.max(...v),diff=v.some(x=>x!==m);return `<tr><td class="lb">${esc(g)}${wgt(g)>1?` <span class="mut" style="font-size:.7rem">${wgt(g)}×</span>`:""}</td>${sel.map((b,i)=>`<td${diff&&v[i]===m&&m>0?' class="bst"':""}>${cell(b,g)}</td>`).join("")}</tr>`};
  const hasEx=goal.some(g=>catOf(g)==="extra"),secR=t=>`<tr><td colspan="${sel.length+1}" class="sec">${t}</td></tr>`,rowsG=hasEx?secR("Typekenmerken")+goal.filter(g=>catOf(g)==="type").map(rowG).join("")+secR("Extra’s")+goal.filter(g=>catOf(g)==="extra").map(rowG).join(""):goal.map(rowG).join("");
  const rowsB=bad.map(g=>`<tr><td class="lb" style="color:var(--bad)">${esc(g)}</td>${sel.map(b=>`<td>${hasT(b,g)?`<span style="color:var(--bad);font-weight:700">Ja</span>`:'<span class="mut">–</span>'}</td>`).join("")}</tr>`).join("");
  const fx=[...goal,...bad].map(key),oth=sel.map(b=>b.traits.filter(t=>!fx.includes(key(t))));
  h+=`<div class="cmpw"><table class="cmp"><tr><th class="lb"></th>${head}</tr><tr><td class="lb">Fokdoel</td>${sel.map((b,i)=>`<td${fits[i]===mx&&fits.some(x=>x!==mx)?' class="bst"':""}><b style="color:${fcol(fits[i])}">${fits[i]}%</b></td>`).join("")}</tr>${rowsG}${bad.length?`<tr><td colspan="${sel.length+1}" class="sec">Ongewenst</td></tr>${rowsB}`:""}${oth.some(a=>a.length)?`<tr><td colspan="${sel.length+1}" class="sec">Overige kenmerken</td></tr><tr><td class="lb"></td>${oth.map(a=>`<td style="font-size:.75rem">${a.map(esc).join("<br>")||'<span class="mut">–</span>'}</td>`).join("")}</tr>`:""}</table></div><p class="mut" style="font-size:.8rem">De groene achtergrond laat per kenmerk zien welk dier er het sterkst in is. Tik op een dier bovenaan om het te openen.</p>`;
  $("v-cmp").innerHTML=h}
let kidSel=new Set();
function kidT(id){kidSel.has(id)?kidSel.delete(id):kidSel.add(id);kidRender()}
function kidRender(){
  const w=$("wkd");if(!w)return;
  const pk=$("bpk").value,par=new Set();{const pp=pairs.find(x=>x.id===bd.pair);if(pp){par.add(pp.rooster);par.add(pp.hen)}}
  const list=sortBirds(birds.filter(x=>x.id!==bd.id&&x.id!==pk&&!par.has(x.id)));
  const sl0=(w.querySelector(".pickrow")||{}).scrollLeft||0;
  w.innerHTML=`<label style="display:block">Nakomelingen${kidSel.size?` (${kidSel.size} gekozen)`:""}</label><div class="pickrow">${list.map(b=>`<div class="pick${kidSel.has(b.id)?" on":""}" onclick="kidT('${b.id}')">${b.photo?`<img src="${b.photo}" alt="">`:`<div class="ph">${sxi(b.sex)}</div>`}<span>${esc(b.name)}${b.born?" · "+esc(yr(b)):""}</span></div>`).join("")||'<span class="mut">Er zijn nog geen andere dieren.</span>'}</div>`;{const pr=w.querySelector(".pickrow");if(pr)pr.scrollLeft=sl0}}
/* ---------- Typekenmerken en extra's ---------- */
function ordT(a){const gi=[...goal.filter(g=>catOf(g)==="type"),...goal.filter(g=>catOf(g)==="extra"),...bad].map(key);const r=t=>{const i=gi.indexOf(key(t));return i<0?9999:i};return a.map((t,i)=>[t,i]).sort((x,y)=>r(x[0])-r(y[0])||x[1]-y[1]).map(x=>x[0])}
const catOf=g=>cats[key(g)]==="extra"?"extra":"type";
const fitC=(b,c)=>{const gs=goal.filter(g=>catOf(g)===c&&!bonus[key(g)]&&applies(b,g)),t=gs.reduce((a,g)=>a+wgt(g),0);return t?Math.round(100*gs.reduce((a,g)=>a+wgt(g)*val(b,g),0)/t):null};
const subFit=b=>{if(!goal.some(g=>catOf(g)==="extra")||!goal.some(g=>catOf(g)==="type"))return"";const a=fitC(b,"type"),c=fitC(b,"extra");return `<div style="font-size:.85rem;margin:-2px 0 8px"><span style="color:${fcol(a)};font-weight:700">Typekenmerken ${a}%</span> · <span style="color:${fcol(c)};font-weight:700">Extra’s ${c}%</span></div><div class="mut" style="font-size:.78rem;margin-top:-4px">In het totaal telt het type voor ${ts}% mee en de extra’s voor ${100-ts}%.</div>`};
function setTS(v){ts=+v;saveGoal()}
function setNB(v){nbon=v;rGoal()}
function setNC(v){ncat=v;rGoal()}
function gSetC(v){const k=key(gtr());if(v==="extra")cats[k]="extra";else delete cats[k];saveGoal()}
const scNote=t=>{const s=scope[key(t)];return (s?` <span class="mut" style="font-size:.75rem">· telt alleen voor ${s==="haan"?"hanen":"hennen"}</span>`:"")+(bonus[key(t)]?' <span class="mut" style="font-size:.75rem">· pluspunt</span>':"")};
function gSetS(v){const k=key(gtr());if(v)scope[k]=v;else delete scope[k];saveGoal()}
function gSetB(v){const k=key(gtr());if(v)bonus[k]=true;else delete bonus[k];saveGoal()}
function gMove(d){const[kind,si]=gedit.split(":"),i=+si,arr=kind==="goal"?goal:bad;let j=i+d;if(kind==="goal"){const c=catOf(arr[i]);while(j>=0&&j<arr.length&&catOf(arr[j])!==c)j+=d}if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];gedit=kind+":"+j;saveGoal()}
/* ---------- Start ---------- */
(async()=>{try{db=await open();await load();rBirds()}catch(e){$("v-birds").innerHTML='<div class="card">Opslag in de browser is niet beschikbaar (privévenster?). Open de pagina in een gewoon venster.</div>'}})();
</script>
