    if(!kp&&kidSel.size){const r=rid===bd.id?bd:bird(rid),h=hid===bd.id?bd:bird(hid),ys=[...kidSel].map(i=>+yr(bird(i))).filter(Boolean);kp={id:uid(),name:`${r.name} × ${h.name}`,rooster:rid,hen:hid,notes:"",year:ys.length?Math.min(...ys):new Date().getFullYear(),updated:Date.now()};await put("pairs",kp);pairs.push(kp)}
    if(kp)for(const k of birds){if(k.id===bd.id)continue;const want=kidSel.has(k.id);if(want&&k.pair!==kp.id){k.pair=kp.id;await put("birds",k)}else if(!want&&k.pair===kp.id){k.pair="";await put("birds",k)}}}

  if(oldB&&oldB.name!==bd.name)for(const p of pairs){if(p.rooster!==bd.id&&p.hen!==bd.id)continue;const R0=p.rooster===bd.id?oldB:bird(p.rooster),H0=p.hen===bd.id?oldB:bird(p.hen),auto=R0&&H0?`${R0.name} × ${H0.name}`:"";let nm=p.name;if(auto&&p.name===auto){const R1=p.rooster===bd.id?bd:R0,H1=p.hen===bd.id?bd:H0;nm=`${R1.name} × ${H1.name}`}else if(p.name&&p.name.includes(oldB.name))nm=p.name.split(oldB.name).join(bd.name);if(nm!==p.name){p.name=nm;await put("pairs",p)}}

const GR=' style="border-color:var(--both);color:var(--both)"',BAD=' style="border-color:var(--bad);color:var(--bad)"';

const remember=async t=>{t=(t||"").trim();if(!t)return;if(!known.map(key).includes(key(t))){known.push(t);await put("meta",{id:"known",traits:known})}if(hidden.map(key).includes(key(t))){hidden=hidden.filter(h=>key(h)!==key(t));await put("meta",{id:"hidden",traits:hidden})}};

const gset=b=>new Set(b.traits.filter(t=>!isCar(b,t)&&applies(b,t)).map(key));const sv=(b,t)=>{if(tp(t)!=="slider")return 3;const k=key(t);if(b.lvl&&b.lvl[k])return b.lvl[k];const o=b.str&&b.str[k];return o?(o<=2?1:o===3?2:3):2};const sc=(b,t)=>gset(b).has(key(t))?sv(b,t):0;
const gcount=b=>{const s=gset(b);return goal.filter(g=>s.has(key(g))).length};
const badOf=b=>{const s=gset(b);return bad.filter(g=>s.has(key(g)))};

function pedGroup(list,d,seen,hi){
  list=list.filter(Boolean);if(!list.length)return"";
  const was=list.map(b=>seen.has(b.id));list.forEach(b=>seen.add(b.id));
  const nodes=list.map((b,i)=>pedNode(b,was[i],b.id===hi));
  const p=pairs.find(x=>x.id===list[0].pair);let kids=[];
  if(p&&d<4&&!was.every(Boolean)){
    const r=bird(p.rooster),h=bird(p.hen);
    if(r&&h&&r.pair&&r.pair===h.pair)kids=[pedGroup([r,h],d+1,seen)];
    else kids=[r,h].filter(Boolean).map(x=>pedGroup([x],d+1,seen))}
  kids=kids.filter(Boolean);
  return `<div class="tt">${nodes.length>1?`<div class="sibs">${nodes.map(n=>`<div class="sn">${n}</div>`).join("")}</div>`:nodes[0]}${kids.length?`<div class="xc">${kids.join("")}</div>`:""}</div>`}

const SXN=x=>x==="haan"?"Haan":"Hen";

function ask(msg,yes){
  const o=document.createElement("div");o.className="ov";
  o.innerHTML=`<div class="card" style="max-width:340px;margin:16px"><p style="margin-top:0">${msg}</p><div class="row"><button class="btn del" id="ay">Ja</button><button class="btn" id="an">Nee</button></div></div>`;
  document.body.appendChild(o);
  o.querySelector("#ay").onclick=()=>{o.remove();yes()};o.querySelector("#an").onclick=()=>o.remove()}
function delBird(id){
  const used=pairs.filter(p=>p.rooster===id||p.hen===id).length;
  ask("Weet je zeker dat je wilt verwijderen?"+(used?`<br><span class="mut">Dit dier zit in ${used} combinatie(s).</span>`:""),async()=>{await rm("birds",id);pv=null;await load();rBirds()})}
function delPair(id){ask("Weet je zeker dat je wilt verwijderen?",async()=>{await rm("pairs",id);pvp=null;await load();rPairs()})}
function refDel(x,i){ask("Weet je zeker dat je wilt verwijderen?",async()=>{ref[x].splice(i,1);await saveRef();rGoal()})}
function gDel(kind,i){const t=(kind==="goal"?goal:bad)[i];ask("Weet je zeker dat je wilt verwijderen?",()=>{remember(t);delete wt[key(t)];delete link[key(t)];delete cats[key(t)];delete scope[key(t)];delete bonus[key(t)];kind==="goal"?goal.splice(i,1):bad.splice(i,1);mf=[];ms="";gedit="";saveGoal()})}
/* ---------- Waardering, potentie, sorteren ---------- */
const shT=b=>b.traits.filter(t=>applies(b,t));
const hasT=(b,g)=>b.traits.some(t=>key(t)===key(g));
const applies=(b,g)=>{const s=scope[key(g)];return !s||s===b.sex};
const val=(b,g)=>{if(!applies(b,g)||!hasT(b,g))return 0;const ty=tp(g);if(ty==="check")return isCar(b,g)?0.5:1;if(ty==="slider")return sv(b,g)/3;return 1};
const bval=(b,g)=>applies(b,g)&&hasT(b,g)?(isCar(b,g)?0.5:1):0;
const linked=g=>{const l=link[key(g)];return !!l&&goal.some(x=>key(x)===l)};
const goalTot=()=>goal.reduce((a,g)=>a+wgt(g),0);
const blend=(vf,ap)=>{ap=ap||(()=>true);const part=c=>{const gs=goal.filter(g=>catOf(g)===c&&!bonus[key(g)]&&ap(g)),t=gs.reduce((a,g)=>a+wgt(g),0);return t?gs.reduce((a,g)=>a+wgt(g)*vf(g),0)/t:null};const a=part("type"),c=part("extra");const base=a===null?(c===null?0:c):c===null?a:ts/100*a+(1-ts/100)*c;const bp=goal.filter(g=>bonus[key(g)]&&ap(g)).reduce((x,g)=>x+wgt(g)*vf(g),0)*0.05;return{base,bp}};
const nbTot=ap=>goal.filter(g=>!bonus[key(g)]&&ap(g)).reduce((a,g)=>a+wgt(g),0);
function fit(b){if(!goal.length)return 0;const ap=g=>applies(b,g),tot=nbTot(ap);let pen=0;bad.forEach(g=>{if(!linked(g))pen+=wgt(g)*bval(b,g)});const{base}=blend(g=>val(b,g),ap);return Math.round(100*Math.min(1,Math.max(0,base-(tot?pen/tot:0))))}
const plusOf=(b)=>Math.round(goal.filter(g=>bonus[key(g)]&&applies(b,g)).reduce((a,g)=>a+wgt(g)*val(b,g),0)*10)/10;
const plusTag=n=>n>0?` <span title="Pluspunten" style="font-size:.75rem;color:var(--mut)">+${n} ★</span>`:"";

function cropPhoto(file){return new Promise(done=>{

  const rel=()=>{if(!isU)URL.revokeObjectURL(url)};
  im.onerror=()=>{rel();isU?done(null):shrink(file).then(done)};

    let mode="1.3333",asp=4/3,zoom=1,cx=iw/2,cy=ih/2;
    const o=document.createElement("div");o.className="cr";
    o.innerHTML=`<div class="mut2">Sleep om te verschuiven, schuif of knijp om te zoomen</div><div class="fr"><canvas></canvas></div><input type="range" min="1" max="4" step="0.01" value="1" aria-label="Inzoomen"><div class="row sm"><button class="btn on" data-a="1.3333">4:3</button><button class="btn" data-a="1">Vierkant</button><button class="btn" data-a="0.75">Staand</button><button class="btn" data-a="full">Hele foto</button></div><button class="btn pri big" id="crok">Klaar</button><button class="btn" id="crno" style="padding:4px 14px">Annuleren</button>`;
    document.body.appendChild(o);

    let fw=0,fh=0,sc=1;
    function layout(){

      const mw=Math.min(innerWidth-32,460),mh=innerHeight-250;

    function clamp(){
      const base=Math.max(fw/iw,fh/ih);sc=base*zoom;

    function draw(){clamp();ctx.clearRect(0,0,fw,fh);ctx.drawImage(im,fw/2-cx*sc,fh/2-cy*sc,iw*sc,ih*sc)}
    const pts=new Map();let pd0=0;
    fr.addEventListener("pointerdown",e=>{fr.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const[a,b]=[...pts.values()];pd0=Math.hypot(a[0]-b[0],a[1]-b[1])}});

      else{pts.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd0){zoom=Math.min(4,Math.max(1,zoom*d/pd0));zr.value=zoom;draw()}pd0=d}});
    const up=e=>{pts.delete(e.pointerId);pd0=0};fr.addEventListener("pointerup",up);fr.addEventListener("pointercancel",up);
    fr.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.min(4,Math.max(1,zoom*(e.deltaY<0?1.08:1/1.08)));zr.value=zoom;draw()},{passive:false});
    zr.oninput=()=>{zoom=+zr.value;draw()};
    o.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{mode=b.dataset.a;o.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x===b));zoom=1;zr.value=1;cx=iw/2;cy=ih/2;layout()});
    const end=r=>{o.remove();rel();done(r)};
    o.querySelector("#crno").onclick=()=>end(null);
    o.querySelector("#crok").onclick=()=>{
      clamp();const sw=fw/sc,sh=fh/sc,ow=Math.min(900,Math.round(sw)),oh=Math.round(ow/asp),c=document.createElement("canvas");c.width=ow;c.height=oh;

    layout()}

  act.forEach(({p,s})=>{const q=s.q;q.ev.forEach(e=>(evs[e.d]=evs[e.d]||[]).push({e,p}));
    const r=[];if(q.start&&!q.inl&&q.start<q.sp)r.push([q.start,addD(q.sp,-1),"w"]);if(!q.inl)r.push([q.sp,addD(q.b0,-1),"s"]);r.push([q.b0,q.hatch,"b"]);rng.push(r)});
  const[y0,m0]=bmo.split("-").map(Number);
  const panel=off=>{const first=isoD(new Date(y0,m0-1+off,1)),[y,m]=first.split("-").map(Number),dow=new Date(y,m-1,1).getDay(),g0=addD(first,-dow),dim=new Date(y,m,0).getDate(),tot=Math.ceil((dow+dim)/7)*7;let cells="";
    for(let i=0;i<tot;i++){const d=addD(g0,i),o=d.slice(0,7)!==first.slice(0,7),list=evs[d]||[];
      const chips=list.slice(0,2).map(x=>`<i class="ek ek-${x.e.k}">${BK[x.e.k]}</i>`).join("")+(list.length>2?`<i class="ek mo">+${list.length-2}</i>`:"");
      const bars=rng.map(r=>{const f=r.find(z=>d>=z[0]&&d<=z[1]);return f?`<u class="pbr b-${f[2]}"></u>`:""}).join("");
      cells+=`<div class="cd${o?" o":""}${d===bsel?" sel":""}" onclick="bSelD('${d}')"><span class="dn${d===T?" td":""}">${+d.slice(8)}</span>${chips}<div class="bars">${bars}</div></div>`}
    return `<div class="cpn"><div class="cal">${["zo","ma","di","wo","do","vr","za"].map(x=>`<div class="cwd">${x}</div>`).join("")}${cells}</div></div>`};
  const day=(evs[bsel]||[]);
  const dl=day.length?day.map(({e,p})=>`<div style="padding:6px 0;border-top:1px solid var(--bd);cursor:pointer" onclick="bOpen('${p.id}')"><i class="ek ek-${e.k}">${BK[e.k]}</i> <span class="mut">${bNm(p.rooster)} × ${bNm(p.hen)}</span><div>${e.t}</div></div>`).join(""):'<p class="mut" style="margin:6px 0 0">Niets gepland op deze dag.</p>';
  return `<div class="card"><div class="row" style="align-items:center;margin:0 0 8px"><button class="btn" onclick="bMo(-1)" aria-label="Vorige maand">‹</button><b style="flex:1;text-align:center;text-transform:capitalize;white-space:nowrap">${new Date(y0,m0-1,1).toLocaleDateString("nl-NL",{month:"long",year:"numeric"})}</b><button class="btn" onclick="bMo(1)" aria-label="Volgende maand">›</button></div>
  <div class="ccar" id="calc" onscroll="bScr()">${panel(-1)}${panel(0)}${panel(1)}</div>
  <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center">${["samen","sparen","inleg","schouw","keren","uit"].map(k=>`<i class="ek ek-${k}">${BK[k]}</i>`).join("")}<button class="btn" style="margin-left:auto;padding:2px 10px" onclick="bToday()">Vandaag</button></div>
  <p class="mut" style="font-size:.78rem;margin:8px 0 0">Veeg naar links of rechts om van maand te wisselen.</p></div>${bpop?`<div class="ovl" onclick="bClose()"><div class="card pop" onclick="event.stopPropagation()"><div class="row" style="align-items:center;margin:0 0 4px"><b style="flex:1">${fmtL(bsel)} <span class="mut" style="font-weight:400">· ${relD(bsel)}</span></b><button class="btn" style="padding:2px 12px;flex:none;width:auto" onclick="bClose()" aria-label="Sluiten">✕</button></div>${dl}</div></div>`:""}`}
function rBrood(){
  const el=$("v-brood");let h="";
  if(bp){const m=bp.mode,e=m!=="al";
    h+=`<div class="card"><h2 style="margin-top:0">${bp.isNew?"Nieuw broedplan":"Broedplan wijzigen"}</h2>${bTiles(bp.rooster,bp.hen)}
    <label>Hoe wil je plannen?</label><select onchange="bpMode(this.value)"><option value="plan"${m==="plan"?" selected":""}>Vanaf de dag van koppelen</option><option value="inleg"${m==="inleg"?" selected":""}>Ik kies de gewenste inlegdatum</option><option value="uit"${m==="uit"?" selected":""}>Ik kies de gewenste uitkomstdatum</option><option value="al"${m==="al"?" selected":""}>De eieren liggen al in</option></select>
    ${m==="plan"?`<label>Datum van koppelen</label><input type="date" value="${esc(bp.start||"")}" oninput="bpF('start',this.value)">`:""}
    ${m==="inleg"||m==="uit"?`<label>${m==="inleg"?"Gewenste inlegdatum":"Gewenste uitkomstdatum"}</label><input type="date" value="${esc(bp.tdate||"")}" oninput="bpF('tdate',this.value)">`:""}
    ${m==="al"?`<label>Eieren ingelegd op</label><input type="date" value="${esc(bp.bstart||"")}" oninput="bpF('bstart',this.value)"><label>Haan en hen gekoppeld sinds (optioneel)</label><input type="date" value="${esc(bp.start||"")}" oninput="bpF('start',this.value)">`:""}
    ${e?`<label>Hoeveel eieren wil je broeden?</label><input type="number" min="1" max="60" inputmode="numeric" value="${bp.eggs}" oninput="bpF('eggs',this.value)">
    <label>Vanaf wanneer zijn de eieren zeker van deze haan?</label><select onchange="bpF('fert',this.value)"><option value="14"${+bp.fert===14?" selected":""}>Na 14 dagen (zeker)</option><option value="10"${+bp.fert===10?" selected":""}>Na 10 dagen (eerder, minder zeker)</option></select>`:""}
    <label>Broedduur in dagen</label><input type="number" min="17" max="30" inputmode="numeric" value="${bp.hatch}" oninput="bpF('hatch',this.value)">
    <label>Notities</label><textarea rows="2" oninput="bp.notes=this.value">${esc(bp.notes||"")}</textarea>
    <div class="row"><button class="btn pri" onclick="bSave()">Opslaan</button><button class="btn" onclick="bBack()">Annuleren</button></div></div>
    <div class="card"><h2 style="margin-top:0">Planning</h2><div id="bprev"></div></div>`;
    el.innerHTML=h;bPrev();return}
  const pl=bv&&brood.find(x=>x.id===bv);
  if(pl){
    const s=bStat(pl),q=s.q,t=todayI();
    const est=!q.inl&&diffD(q.sp,t)>=0&&diffD(q.b0,t)<0?`<p style="margin:8px 0">Verwacht ± ${Math.min(q.eggs,Math.floor(diffD(q.sp,t)*2/3))} van ${q.eggs} eieren tot nu toe.</p>`:"";
    h+=`<button class="btn" onclick="bBack()">‹ Terug</button><div class="card" style="margin-top:10px"><h2 style="margin-top:0">Broedplan</h2>${bTiles(pl.rooster,pl.hen)}<div><span class="tag" style="margin:0">${s.txt}</span></div>${est}${pl.notes?`<p class="mut" style="white-space:pre-wrap">${esc(pl.notes)}</p>`:""}${bInfo(q)}${bTL(q)}
    <div class="row" style="margin-top:8px"><button class="btn" onclick="bEdit('${pl.id}')">Wijzigen</button><button class="btn" onclick="bPair('${pl.id}')">Naar combinatie</button></div>
    <div class="row"><button class="btn" onclick="bDone('${pl.id}',${!pl.done})">${pl.done?"Heropenen":"Markeer als afgerond"}</button><button class="btn del" onclick="bDel('${pl.id}')">Verwijderen</button></div></div>`+icsCard(pl.id);
    el.innerHTML=h;return}
  if(bch){
    const hs=birds.filter(b=>b.sex==="haan"&&!b.gone),hn=birds.filter(b=>b.sex==="hen"&&!b.gone);
    const pk=(l,w)=>l.map(b=>`<div class="pick${bnp[w]===b.id?" on":""}" onclick="bnp.${w}=bnp.${w}==='${b.id}'?'':'${b.id}';rBrood()">${b.photo?`<img src="${b.photo}" alt="${esc(b.name)}">`:`<div class="ph">${sxi(b.sex)}</div>`}<span>${esc(b.name)}</span></div>`).join("")||'<span class="mut">Nog geen dieren van dit geslacht.</span>';
    h+=`<button class="btn" onclick="bCh(false)">‹ Terug</button><h2>Nieuw broedplan</h2>${seg([["kies","Kies een combinatie"],["nieuw","Maak nieuwe combinatie"]],bchM,"bchSet")}`;
    if(bchM==="kies")h+=(pairs.length?pairs.map(p=>`<div class="card" style="cursor:pointer;margin-top:10px" onclick="bNew('${p.rooster}','${p.hen}')"><b>${esc(p.name)}</b>${bTiles(p.rooster,p.hen)}</div>`).join(""):`<p class="mut">Er zijn nog geen combinaties. Kies hierboven “Maak nieuwe combinatie”.</p>`);
    else h+=`<div class="card" style="margin-top:10px"><label>${sxl("haan")}</label><div class="pickrow">${pk(hs,"r")}</div><label>${sxl("hen")}</label><div class="pickrow">${pk(hn,"h")}</div><button class="btn pri" style="margin-top:12px;width:100%" onclick="bMakeNew()">Combinatie maken en plan starten</button></div>`;
    el.innerHTML=h;return}
  const act=[],fin=[];brood.forEach(p=>{const s=bStat(p);(s.ph===4?fin:act).push({p,s})});
  act.sort((a,b)=>{const x=bNext(a.s.q),y=bNext(b.s.q);return (x?x.d:"9")<(y?y.d:"9")?-1:1});
  const nm=p=>`${bNm(p.rooster)} × ${bNm(p.hen)}`;
  h+=`<button class="btn pri" style="width:100%;margin-bottom:12px" onclick="bCh(true)">+ Nieuw broedplan</button>`+bCal(act);
  if(act.length)h+=`<h2>Lopende plannen (${act.length})</h2>`+act.map(({p,s})=>{const n=bNext(s.q);return `<div class="card" style="cursor:pointer" onclick="bOpen('${p.id}')">${bTiles(p.rooster,p.hen)}<span class="tag" style="margin:0">${s.txt}</span>${n?`<div class="mut" style="margin-top:6px">Volgende: ${fmtL(n.d)} (${relD(n.d)})<br>${n.t}</div>`:""}</div>`}).join("");
  else h+='<p class="mut">Nog geen broedplannen. Een broedplan hoort bij een combinatie.</p>';
  if(act.length)h+=icsCard();
  if(fin.length)h+=`<h2>Afgerond (${fin.length})</h2>`+fin.map(({p,s})=>`<div class="card" style="cursor:pointer" onclick="bOpen('${p.id}')"><b>${nm(p)}</b> <span class="mut">· uitgekomen ${fmtL(s.q.hatch)}</span></div>`).join("");
  el.innerHTML=h;const cc=$("calc");if(cc)cc.scrollLeft=cc.clientWidth}

/* herinneringen */
function brBar(){const el=$("brbar");if(!el)return;const t=todayI(),t1=addD(t,1),l=[];
  brood.forEach(p=>{const st=bStat(p);if(st.ph===4)return;st.q.ev.forEach(e=>{if(e.d===t||e.d===t1)l.push({e,p})})});
  if(!l.length){el.innerHTML="";return}
  l.sort((a,b)=>a.e.d<b.e.d?-1:a.e.d>b.e.d?1:0);
  el.innerHTML=`<div class="card" style="margin:0 0 10px"><b>Broeden</b>${l.slice(0,4).map(({e,p})=>`<div style="padding:6px 0 0;cursor:pointer" onclick="bOpen('${p.id}')"><i class="ek ek-${e.k}">${BK[e.k]}</i> <span class="mut">${e.d===t?"vandaag":"morgen"} · ${bNm(p.rooster)} × ${bNm(p.hen)}</span><div>${e.t}</div></div>`).join("")}${l.length>4?`<div class="mut" style="margin-top:6px">En nog ${l.length-4} meer in de Broedkalender.</div>`:""}</div>`}
function icsEsc(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function icsFold(l){let o="";while(l.length>70){o+=l.slice(0,70)+"\r\n ";l=l.slice(70)}return o+l}
async function icsExport(ids){
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),T=todayI(),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Fokplanner//NL","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Broedplanning"];
  let n=0;
  brood.filter(p=>!ids||ids.includes(p.id)).forEach(p=>{if(!ids&&bStat(p).ph===4)return;const cnt={};
    bPlan(p).ev.forEach(e=>{cnt[e.k]=(cnt[e.k]||0)+1;if(e.d<T)return;n++;const d=e.d.replace(/-/g,"");
      L.push("BEGIN:VEVENT","UID:"+p.id+"-"+e.k+cnt[e.k]+"@fokplanner","DTSTAMP:"+now,"DTSTART:"+d+"T090000","DTEND:"+d+"T093000",
        icsFold("SUMMARY:"+icsEsc("Broeden: "+BK[e.k]+" ("+(bird(p.rooster)?bird(p.rooster).name:"?")+" × "+(bird(p.hen)?bird(p.hen).name:"?")+")")),
        icsFold("DESCRIPTION:"+icsEsc(e.t)),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(BK[e.k]),"TRIGGER:PT0S","END:VALARM","END:VEVENT")})});
  if(!n){alert("Er zijn geen komende stappen om in de agenda te zetten.");return}
  L.push("END:VCALENDAR");
  const txt=L.join("\r\n"),file=new File([txt],"broedplanning.ics",{type:"text/calendar"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Broedplanning"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download="broedplanning.ics";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const icsCard=ids=>`<div class="card"><h2 style="margin-top:0">Herinneringen</h2><p class="mut" style="margin:0 0 8px">De app kan je niet zelf waarschuwen als hij gesloten is. Zet de stappen daarom in de agenda van je telefoon. Je krijgt dan elke ochtend om 9:00 een melding op de dag zelf. Verschuift er later iets, zet de stappen dan opnieuw in de agenda. Dan worden ze bijgewerkt.</p><button class="btn pri" onclick="icsExport(${ids?`['${ids}']`:""})">Zet in agenda</button></div>`;
let stamId="";
function stamSet(id){stamId=stamId===id?"":id;rStam()}
function rStam(){const pool=birds.slice().sort(byName),b=bird(stamId);
  $("v-stam").innerHTML=`<div class="card"><h2 style="margin-top:0">Stamboom</h2><p class="mut" style="margin-top:0">Tik een dier aan om de stamboom te zien.</p><div class="pickrow" id="stpk">${pool.map(x=>`<div class="pick${x.id===stamId?" on":""}" onclick="stamSet('${x.id}')">${x.photo?`<img src="${x.photo}" alt="${esc(x.name)}">`:`<div class="ph">${sxi(x.sex)}</div>`}<span>${esc(x.name)}</span></div>`).join("")||'<span class="mut">Nog geen dieren.</span>'}</div></div>${b?`<div class="card"><h2 style="margin-top:0">${esc(b.name)}</h2><div class="mut" style="font-size:.8rem;margin-bottom:6px">Het dier staat bovenaan, daaronder de ouders en grootouders. Veeg opzij voor de rest. Tik op een dier om het te openen.</div><div class="pedw">${ped(b.id)}</div></div>`:""}`}
/* ---------- Start ---------- */
(async()=>{try{db=await open();await load();rBirds();bkBar();brBar();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}catch(e){$("v-birds").innerHTML='<div class="card">Opslag in de browser is niet beschikbaar (privévenster?). Open de pagina in een gewoon venster.</div>'}})();
</script>
